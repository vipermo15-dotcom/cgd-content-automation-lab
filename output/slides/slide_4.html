<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Portfolio & Career</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --primary-color: #3b82f6;
      --accent-color: #60a5fa;
      --bg-dark: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --badge-bg: rgba(59, 130, 246, 0.15);
      --badge-border: rgba(96, 165, 250, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      width: 1080px;
      height: 1080px;
      background-color: var(--bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin: 0;
    }

    .card-container {
      width: 1080px;
      height: 1080px;
      position: relative;
      background: radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.18) 0%, transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                  var(--bg-dark);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px;
    }

    /* AI Generated Visual Background Container */
    .visual-bg-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.45;
      background-size: cover;
      background-position: center;
      filter: saturate(1.2) contrast(1.05);
      mix-blend-mode: screen;
    }

    /* Content Layer above visual background */
    .content-layer {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      border-radius: 9999px;
      backdrop-filter: blur(12px);
      color: var(--accent-color);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.3px;
    }

    .slide-indicator {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 2px;
    }

    .slide-indicator span {
      color: var(--accent-color);
    }

    /* Main Typography */
    .main-body {
      margin-top: auto;
      margin-bottom: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .category-label {
      font-size: 24px;
      font-weight: 600;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .title {
      font-size: 58px;
      font-weight: 800;
      line-height: 1.25;
      color: var(--text-main);
      letter-spacing: -1.2px;
      word-break: keep-all;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .title .highlight {
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      font-size: 28px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-sub);
      word-break: keep-all;
      max-width: 900px;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .footer-note {
      font-size: 20px;
      color: #64748b;
      font-weight: 500;
    }

    .cta-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      padding: 14px 28px;
      border-radius: 9999px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
    }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="visual-bg-wrapper" style="background-image: url('../assets/ai_visual_bg.svg');"></div>
    <div class="content-layer">
      <div class="header">
        <div class="brand-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          컴그과 AI Studio
        </div>
        <div class="slide-indicator"><span>04</span> / 05</div>
      </div>

      <div class="main-body">
        <div class="category-label">Portfolio & Career</div>
        <h1 class="title">취업으로 직결되는 <span class='highlight'>1:1 전담 포트폴리오</span></h1>
        <p class="description">업계 전문가와 AI 진단 에이전트가 함께하는 맞춤형 포트폴리오 첨삭. 채용 트렌드에 최적화된 포트폴리오로 원하는 기업에 도전하세요.</p>
      </div>

      <div class="footer">
        <div class="footer-note">수료 후 1:1 취업 연계 지원</div>
        <div class="cta-pill">취업 사례 보기 →</div>
      </div>
    </div>
  </div>
</body>
</html>

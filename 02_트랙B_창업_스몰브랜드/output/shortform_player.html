<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Reels Player - Track B</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Pretendard', sans-serif; }
    body { background:#000; color:#fff; width:100vw; height:100vh; overflow:hidden; display:flex; justify-content:center; align-items:center; }
    .phone-screen {
      width:100%; height:100%; position:relative; background: radial-gradient(circle at 50% 30%, #064e3b 0%, #022c22 100%);
      overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; padding:40px 24px 30px;
    }
    .blob { position:absolute; border-radius:50%; filter:blur(50px); animation:floatBlob 8s infinite alternate ease-in-out; }
    .blob-1 { width:250px; height:250px; background:#10b981; top:15%; left:-10%; opacity:0.35; }
    .blob-2 { width:300px; height:300px; background:#059669; bottom:20%; right:-20%; opacity:0.3; }
    @keyframes floatBlob { 0% { transform:translate(0,0) scale(1); } 100% { transform:translate(30px,40px) scale(1.15); } }
    .top-progress { display:flex; gap:4px; width:100%; height:3px; position:relative; z-index:20; }
    .bar-segment { flex:1; background:rgba(255,255,255,0.25); border-radius:2px; overflow:hidden; }
    .bar-fill { height:100%; width:0%; background:#34d399; transition:width 0.1s linear; }
    .badge { display:inline-flex; align-items:center; gap:6px; background:rgba(16,185,129,0.25); border:1px solid rgba(52,211,153,0.4); padding:6px 14px; border-radius:999px; font-size:13px; font-weight:700; color:#a7f3d0; }
    .scene-viewport { position:relative; z-index:15; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; flex:1; }
    .scene-tag { font-size:14px; font-weight:700; color:#34d399; letter-spacing:2px; margin-bottom:12px; }
    .scene-title { font-size:32px; font-weight:900; line-height:1.3; margin-bottom:16px; text-shadow:0 4px 20px rgba(0,0,0,0.8); }
    .scene-title span { background:linear-gradient(135deg, #34d399, #fef08a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .kinetic-subtitle { background:rgba(0,0,0,0.75); border:1px solid rgba(255,255,255,0.15); padding:10px 20px; border-radius:12px; font-size:19px; font-weight:800; color:#fef08a; }
    .cta-banner { background:linear-gradient(135deg, #059669, #10b981); color:#064e3b; padding:12px 20px; border-radius:12px; display:flex; justify-content:space-between; font-weight:800; font-size:14px; }
  </style>
</head>
<body>
  <div class="phone-screen">
    <div class="blob blob-1"></div><div class="blob blob-2"></div>
    <div class="top-progress">
      <div class="bar-segment"><div class="bar-fill" id="fill-0"></div></div>
      <div class="bar-segment"><div class="bar-fill" id="fill-1"></div></div>
      <div class="bar-segment"><div class="bar-fill" id="fill-2"></div></div>
      <div class="bar-segment"><div class="bar-fill" id="fill-3"></div></div>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; position:relative; z-index:20;">
      <div class="badge">🌿 트랙 B: 1인 브랜드 창업</div>
      <button onclick="toggleSound()" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer;" id="snd">🔊</button>
    </div>
    <div class="scene-viewport">
      <div class="scene-tag" id="scene-tag">SCENE 01 / HOOK</div>
      <h1 class="scene-title" id="scene-title">성수동 팝업스토어<br><span>선착순 에코백 선물!</span></h1>
      <div class="kinetic-subtitle" id="kinetic-caption">"이번 주말 성수동에서 특별한 제로웨이스트 팝업이 열립니다."</div>
    </div>
    <div style="position:relative; z-index:20; display:flex; flex-direction:column; gap:12px;">
      <div class="cta-banner"><span>성수 팝업 사전 예약하기</span><span>10% 할인 쿠폰 →</span></div>
    </div>
  </div>
  <script>
    const scenes = [
      { tag:"SCENE 01 / HOOK (0~5s)", title:"성수동 팝업스토어<br><span>선착순 에코백 선물!</span>", caption:"이번 주말 성수동에서 특별한 제로웨이스트 팝업이 열립니다.", duration:5000, voice:"이번 주말 성수동에서 선착순 에코백을 선물로 드리는 제로웨이스트 팝업이 열립니다." },
      { tag:"SCENE 02 / VALUE (5~13s)", title:"플라스틱 프리<br><span>자연을 닮은 데일리 굿즈</span>", caption:"100% 대나무 섬유 텀블러와 파우치로 일상에 쉼을 선물하세요.", duration:8000, voice:"플라스틱 프리! 일상 속 작은 변화를 만드는 친환경 굿즈들을 직접 만나보세요." },
      { tag:"SCENE 03 / STORY (13~23s)", title:"1인 창업가의 도전<br><span>마케팅 외주비 0원의 비밀</span>", caption:"AI 에이전트로 혼자서 브랜딩부터 SNS 홍보까지 완성했습니다.", duration:10000, voice:"마케팅 외주비 영원! AI 에이전트로 브랜딩부터 다채널 홍보까지 혼자서 완성했습니다." },
      { tag:"SCENE 04 / CTA (23~30s)", title:"프로필 링크에서<br><span>10% 할인 쿠폰 받기!</span>", caption:"지금 네이버 예약 시 10% 쿠폰 즉시 지급!", duration:7000, voice:"지금 프로필 링크에서 네이버 사전 예약하고 십 퍼센트 할인 쿠폰을 받아보세요!" }
    ];
    let idx = 0, isSound = true, timer;
    function speak(t){ if(!isSound || !('speechSynthesis' in window))return; window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; window.speechSynthesis.speak(u); }
    function playScene(i){
      const s=scenes[i];
      document.getElementById('scene-tag').innerText=s.tag;
      document.getElementById('scene-title').innerHTML=s.title;
      document.getElementById('kinetic-caption').innerText=s.caption;
      for(let j=0; j<4; j++){ document.getElementById('fill-'+j).style.width = j<i?'100%':'0%'; }
      speak(s.voice);
      const fill = document.getElementById('fill-'+i);
      let start = Date.now();
      clearInterval(timer);
      timer = setInterval(()=>{
        let el = Date.now() - start;
        let p = Math.min((el/s.duration)*100, 100);
        fill.style.width = p+'%';
        if(p>=100){ clearInterval(timer); idx=(idx+1)%scenes.length; playScene(idx); }
      }, 50);
    }
    function toggleSound(){ isSound=!isSound; document.getElementById('snd').innerText=isSound?'🔊':'🔇'; if(!isSound)window.speechSynthesis.cancel(); }
    window.onload=()=>{ playScene(0); };
  </script>
</body>
</html>

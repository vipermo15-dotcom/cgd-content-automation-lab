<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Exclusive Event</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --primary-color: #10b981;
      --accent-color: #34d399;
      --bg-dark: #061712;
      --text-main: #f0fdf4;
      --text-sub: #a7f3d0;
    }
    * { box-sizing: border-box; margin:0; padding:0; font-family:'Pretendard', sans-serif; }
    body {
      width: 1080px; height: 1080px; background: var(--bg-dark);
      display: flex; justify-content: center; align-items: center; overflow: hidden;
    }
    .card-container {
      width: 1080px; height: 1080px; position: relative;
      background: radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.2) 0%, transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(5, 150, 105, 0.15) 0%, transparent 50%),
                  var(--bg-dark);
      display: flex; flex-direction: column; justify-content: space-between; padding: 80px;
    }
    .visual-bg-wrapper {
      position: absolute; top:0; left:0; width:100%; height:100%; z-index:1; opacity:0.45;
      background-size: cover; background-position: center; mix-blend-mode: screen;
    }
    .content-layer {
      position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: space-between;
    }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand-badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px;
      background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 9999px; color: var(--accent-color); font-weight: 700; font-size: 18px;
    }
    .slide-indicator { font-size: 24px; font-weight: 700; color: #6ee7b7; letter-spacing: 2px; }
    .slide-indicator span { color: #fff; }
    .main-body { margin-top: auto; margin-bottom: auto; display: flex; flex-direction: column; gap: 24px; }
    .category-label { font-size: 22px; font-weight: 700; color: var(--accent-color); letter-spacing: 2px; text-transform: uppercase; }
    .title { font-size: 56px; font-weight: 800; line-height: 1.25; color: var(--text-main); word-break: keep-all; }
    .title .highlight {
      background: linear-gradient(135deg, #34d399 0%, #fef08a 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .description { font-size: 28px; line-height: 1.6; color: #d1fae5; word-break: keep-all; max-width: 900px; }
    .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 30px; border-top: 1px solid rgba(255, 255, 255, 0.12); }
    .footer-note { font-size: 20px; color: #6ee7b7; font-weight: 500; }
    .cta-pill {
      font-size: 20px; font-weight: 700; color: #064e3b; background: linear-gradient(135deg, #34d399, #10b981);
      padding: 14px 28px; border-radius: 9999px; box-shadow: 0 8px 24px rgba(16,185,129,0.35);
    }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="visual-bg-wrapper" style="background-image: url('../assets/track_b_bg.svg');"></div>
    <div class="content-layer">
      <div class="header">
        <div class="brand-badge">🌿 FOREST & EARTH</div>
        <div class="slide-indicator"><span>03</span> / 05</div>
      </div>
      <div class="main-body">
        <div class="category-label">Exclusive Event</div>
        <h1 class="title">방문객 전원 증정!<br><span class='highlight'>한정판 미니 에코백 선물</span></h1>
        <p class="description">팝업 기간 동안 현장에 방문하여 인스타그램 인증을 남겨주신 선착순 100분께 매일 특별 제작된 린넨 미니 에코백을 선물로 드립니다.</p>
      </div>
      <div class="footer">
        <div class="footer-note">매일 선착순 100명 한정 증정</div>
        <div class="cta-pill">이벤트 참여하기 →</div>
      </div>
    </div>
  </div>
</body>
</html>
